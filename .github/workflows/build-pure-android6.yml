# Build OpenCode for Android
# 1. Clone upstream source → apply patches → bun build --compile
# 2. Download Android Bun
# 3. Wrap con bun-termux-loader (prebuilt desde Hope2333/opencode-termux)
# 4. Package como .pkg.tar.xz y .deb → subir a GitHub Release

name: Build OpenCode for Android

on:
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: "Upstream branch/tag (default: dev)"
        required: false
        default: "dev"
      opencode_version:
        description: "Version tag for output (e.g. 1.16.2) — vacío = auto desde package.json"
        required: false
        default: ""
      publish_release:
        description: "Publicar Release en GitHub (true/false)"
        required: false
        default: "true"

env:
  BUN_ANDROID_VER: "1.3.14"
  BUN_TERMUX_LOADER_REPO: "https://github.com/Hope2333/bun-termux-loader"
  FORK_OWNER: "Honkonx"

jobs:
  build:
    permissions:
      contents: write   # GITHUB_TOKEN puede crear releases y subir assets
    strategy:
      matrix:
        arch: [aarch64, x64]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for aarch64
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

      - name: Prepare directories
        run: mkdir -p out/bundle out/status out/build

      - name: Install Bun (Linux)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone upstream + apply patches
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.inputs.opencode_ref || 'dev' }}" \
            https://github.com/anomalyco/opencode.git out/build/opencode-source 2>&1 || exit 1
          cd out/build/opencode-source
          if [[ -d "$GITHUB_WORKSPACE/patches" ]]; then
            for p in "$GITHUB_WORKSPACE/patches/"*.patch; do
              if [[ -f "$p" ]]; then
                echo "Applying: $(basename $p)"
                git apply "$p" 2>&1 || echo "Warning: patch failed (may already be applied)"
              fi
            done
          fi

      # Resolver versión desde package.json si no se pasó como input
      - name: Resolve OpenCode version
        run: |
          INPUT_VER="${{ github.event.inputs.opencode_version }}"
          if [ -n "$INPUT_VER" ]; then
            echo "OPENCODE_VERSION=$INPUT_VER" >> $GITHUB_ENV
          else
            PKG="out/build/opencode-source/packages/opencode/package.json"
            if [ -f "$PKG" ]; then
              VER=$(node -p "require('./$PKG').version" 2>/dev/null || echo "")
            fi
            [ -z "${VER:-}" ] && VER="unknown"
            echo "OPENCODE_VERSION=$VER" >> $GITHUB_ENV
          fi

      - name: Build OpenCode binary
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          # Mapear arch de la matriz al target de bun
          if [[ "$ARCH" == "aarch64" ]]; then
            BUN_TARGET="linux-arm64"
          else
            BUN_TARGET="linux-x64"
          fi
          DIST_NAME="opencode-${BUN_TARGET}"

          cd out/build/opencode-source
          bun install 2>&1 | tail -3
          cd packages/opencode
          bun run build --target="${BUN_TARGET}" 2>&1 | tail -10

          # El build produce un DIRECTORIO dist/opencode-<target>/
          # con el binario 'opencode' dentro — NO un archivo plano
          DIST_DIR="$(find ../.. -maxdepth 5 -type d -name "${DIST_NAME}" 2>/dev/null | head -1 || true)"
          if [[ -n "$DIST_DIR" ]]; then
            BIN="$(find "$DIST_DIR" -maxdepth 2 -type f -executable 2>/dev/null | head -1 || true)"
            [[ -z "$BIN" ]] && BIN="$(find "$DIST_DIR" -maxdepth 2 -type f 2>/dev/null | grep -v '\.map$' | head -1 || true)"
            if [[ -n "$BIN" ]]; then
              cp "$BIN" "$GITHUB_WORKSPACE/out/bundle/opencode-${BUN_TARGET}"
              chmod +x "$GITHUB_WORKSPACE/out/bundle/opencode-${BUN_TARGET}"
              echo "Binary found: $BIN (target: ${BUN_TARGET})"
              echo "Binary size: $(du -sh $GITHUB_WORKSPACE/out/bundle/opencode-${BUN_TARGET} | cut -f1)"
              file "$GITHUB_WORKSPACE/out/bundle/opencode-${BUN_TARGET}"
            else
              echo "ERROR: No executable found inside $DIST_DIR"
              ls -la "$DIST_DIR" || true
              exit 1
            fi
          else
            echo "ERROR: dist directory ${DIST_NAME} not found"
            ls -la dist/ 2>/dev/null || true
            find ../.. -maxdepth 6 -name "opencode*" 2>/dev/null | head -20 || true
            exit 1
          fi

      - name: Download Android Bun for ${{ matrix.arch }}
        continue-on-error: true
        run: |
          URL="https://github.com/oven-sh/bun/releases/download/bun-v$BUN_ANDROID_VER/bun-linux-${{ matrix.arch }}-android.zip"
          curl -fL "$URL" -o out/bundle/bun-android.zip || exit 0
          mkdir -p out/bun-tmp && unzip -o out/bundle/bun-android.zip -d out/bun-tmp/
          B="$(find out/bun-tmp/ -name 'bun' -type f | head -1)"
          if [[ -n "$B" ]]; then
            cp "$B" out/bundle/bun-linux-android && chmod +x out/bundle/bun-linux-android
            file out/bundle/bun-linux-android
          fi
          rm -rf out/bun-tmp

      - name: Clone bun-termux-loader
        run: |
          git clone --depth 1 "$BUN_TERMUX_LOADER_REPO" out/build/loader 2>&1 || true
          if [[ -f "out/build/loader/build.py" ]]; then echo "Loader ready"; fi

      - name: Wrap for Android
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          # El wrap con bun-termux-loader solo aplica a aarch64
          if [[ "$ARCH" != "aarch64" ]]; then
            echo "Wrap skipped for arch: $ARCH"; exit 0
          fi
          BIN="$(pwd)/out/bundle/opencode-linux-arm64"
          LOADER="$(pwd)/out/build/loader"
          if [[ ! -f "$BIN" || ! -f "$LOADER/build.py" ]]; then
            echo "Binary or loader not available, skipping wrap" >&2
            exit 0
          fi
          if [[ -f "tools/prebuilt/wrapper" && -f "tools/prebuilt/bunfs_shim.so" ]]; then
            cp tools/prebuilt/wrapper "$LOADER/wrapper"
            cp tools/prebuilt/bunfs_shim.so "$LOADER/bunfs_shim.so"
            python3 "$LOADER/build.py" "$BIN" --wrapper "$LOADER/wrapper" --shim "$LOADER/bunfs_shim.so" 2>&1
            TERMUX_BIN="${BIN}-termux"
            if [[ -f "$TERMUX_BIN" ]]; then
              cp "$TERMUX_BIN" out/bundle/opencode-termux-aarch64
              file out/bundle/opencode-termux-aarch64
            fi
          else
            echo "tools/prebuilt/ not available — binary will be used as-is"
          fi

      # Empaquetar como .pkg.tar.xz (Termux) y .deb
      - name: Package as pkg.tar.xz and deb
        run: |
          set -euo pipefail
          VER="${OPENCODE_VERSION}"
          ARCH="${{ matrix.arch }}"

          # Seleccionar binario según arch
          if [[ "$ARCH" == "aarch64" ]]; then
            # Preferir wrapeado si existe, sino raw arm64
            if [[ -f "out/bundle/opencode-termux-aarch64" ]]; then
              FINAL_BIN="out/bundle/opencode-termux-aarch64"
            elif [[ -f "out/bundle/opencode-linux-arm64" ]]; then
              FINAL_BIN="out/bundle/opencode-linux-arm64"
            else
              echo "No aarch64 binary to package — skipping"; exit 0
            fi
          else
            if [[ -f "out/bundle/opencode-linux-x64" ]]; then
              FINAL_BIN="out/bundle/opencode-linux-x64"
            else
              echo "No x64 binary to package — skipping"; exit 0
            fi
          fi

          # ── Estructura común ──────────────────────────────
          PKG_DIR="out/pkg-${ARCH}"
          mkdir -p "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/lib/opencode/runtime"
          cp "$FINAL_BIN" "${PKG_DIR}/usr/bin/opencode"
          chmod 755 "${PKG_DIR}/usr/bin/opencode"

          if [[ -f "out/bundle/bun-linux-android" ]]; then
            cp "out/bundle/bun-linux-android" "${PKG_DIR}/usr/lib/opencode/runtime/opencode"
            chmod 755 "${PKG_DIR}/usr/lib/opencode/runtime/opencode"
          fi

          SIZE=$(du -sb "${PKG_DIR}/usr" | cut -f1)

          # ── .pkg.tar.xz (formato Termux/Arch) ────────────
          # printf en vez de heredoc — evita conflicto YAML/bash
          {
            printf 'pkgname = opencode\n'
            printf 'pkgver = %s-1\n' "$VER"
            printf 'arch = aarch64\n'
            printf 'size = %s\n' "$SIZE"
            printf 'pkgdesc = OpenCode AI coding agent - Termux native ARM64\n'
            printf 'url = https://github.com/%s/opencode-termux\n' "$FORK_OWNER"
          } > "${PKG_DIR}/.PKGINFO"

          TAR_OUT="out/bundle/opencode-${VER}-1-aarch64.pkg.tar.xz"
          tar --numeric-owner -cJf "$TAR_OUT" -C "$PKG_DIR" .PKGINFO usr/
          echo "pkg.tar.xz: $TAR_OUT ($(du -sh $TAR_OUT | cut -f1))"

          # ── .deb ─────────────────────────────────────────
          DEB_DIR="out/deb-${ARCH}"
          mkdir -p "${DEB_DIR}/DEBIAN" "${DEB_DIR}/usr/bin" "${DEB_DIR}/usr/lib/opencode/runtime"
          cp "$FINAL_BIN" "${DEB_DIR}/usr/bin/opencode"
          chmod 755 "${DEB_DIR}/usr/bin/opencode"
          if [[ -f "out/bundle/bun-linux-android" ]]; then
            cp "out/bundle/bun-linux-android" "${DEB_DIR}/usr/lib/opencode/runtime/opencode"
            chmod 755 "${DEB_DIR}/usr/lib/opencode/runtime/opencode"
          fi
          INSTALLED_SIZE=$(du -sk "${DEB_DIR}/usr" | cut -f1)
          OC_REF="${{ github.event.inputs.opencode_ref || 'dev' }}"
          # printf en vez de heredoc
          {
            printf 'Package: opencode\n'
            printf 'Version: %s\n' "$VER"
            printf 'Architecture: arm64\n'
            printf 'Installed-Size: %s\n' "$INSTALLED_SIZE"
            printf 'Maintainer: %s <noreply@github.com>\n' "$FORK_OWNER"
            printf 'Description: OpenCode AI coding agent - Termux native ARM64\n'
            printf ' Compilado desde anomalyco/opencode@%s\n' "$OC_REF"
            printf ' Fork: https://github.com/%s/opencode-termux\n' "$FORK_OWNER"
          } > "${DEB_DIR}/DEBIAN/control"

          DEB_OUT="out/bundle/opencode_${VER}_aarch64.deb"
          dpkg-deb --build "$DEB_DIR" "$DEB_OUT"
          echo "deb: $DEB_OUT ($(du -sh $DEB_OUT | cut -f1))"


      - name: Generate checksums
        run: |
          cd out/bundle
          sha256sum *.pkg.tar.xz *.deb opencode-termux-aarch64 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-${{ matrix.arch }}
          path: out/bundle/
          retention-days: 30

      # Release solo para aarch64 — x64 solo sube artifact
      - name: Publish GitHub Release
        if: ${{ matrix.arch == 'aarch64' && github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.OPENCODE_VERSION }}
          name: "OpenCode v${{ env.OPENCODE_VERSION }} — Android ARM64 (Termux native)"
          body: |
            ## OpenCode ${{ env.OPENCODE_VERSION }} — Termux native ARM64

            Compilado desde [`anomalyco/opencode`](https://github.com/anomalyco/opencode) ref `${{ github.event.inputs.opencode_ref || 'dev' }}`.

            ### Instalación automática (termux-ai-stack)
            ```bash
            bash install_opencode.sh
            ```

            ### Instalación manual
            ```bash
            pkg install glibc-repo && pkg update && pkg install glibc openssl-glibc

            # Opción A — pkg.tar.xz (recomendado)
            curl -fsSL https://github.com/Honkonx/opencode-termux/releases/latest/download/opencode-${{ env.OPENCODE_VERSION }}-1-aarch64.pkg.tar.xz \
              -o opencode.pkg.tar.xz
            tar -xJf opencode.pkg.tar.xz -C $PREFIX/

            # Opción B — .deb
            curl -fsSL https://github.com/Honkonx/opencode-termux/releases/latest/download/opencode_${{ env.OPENCODE_VERSION }}_aarch64.deb \
              -o opencode.deb
            dpkg -i opencode.deb
            ```

            ### Checksums
            Ver `SHA256SUMS` adjunto.
          files: |
            out/bundle/opencode-${{ env.OPENCODE_VERSION }}-1-aarch64.pkg.tar.xz
            out/bundle/opencode_${{ env.OPENCODE_VERSION }}_aarch64.deb
            out/bundle/opencode-termux-aarch64
            out/bundle/SHA256SUMS
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write status
        if: always()
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_REF: ${{ github.event.inputs.opencode_ref || 'dev' }}
        run: |
          python3 -c "
          import json, os
          from pathlib import Path
          bundle = Path('out/bundle')
          assets = sorted([str(p.relative_to(Path('out'))) for p in bundle.rglob('*') if p.is_file()]) if bundle.exists() else []
          Path('out/status/build-status.json').write_text(json.dumps({
            'arch': os.environ.get('BUILD_ARCH', 'unknown'),
            'version': os.environ.get('OPENCODE_VERSION', 'unknown'),
            'ref': os.environ.get('BUILD_REF', 'dev'),
            'status': 'completed',
            'artifacts': assets,
          }, indent=2)+'\n')
          "
